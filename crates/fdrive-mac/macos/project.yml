name: Filestash
options:
  bundleIdPrefix: app.filestash
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3736F8X9F9
targets:
  FilestashTestKit:
    type: application
    platform: macOS
    sources:
      - TestKit
      - Shared
      - Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.filestash.mac
    info:
      path: TestKit/Info.plist
      properties:
        CFBundleDisplayName: Filestash TestKit
        LSUIElement: true
    entitlements:
      path: App/Filestash.entitlements
    dependencies:
      - target: FilestashFileProvider
      - framework: Fdrive.xcframework
        embed: false
  Filestash:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.filestash.mac
        PRODUCT_NAME: Filestash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        REGISTER_APP_GROUPS: "YES"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Filestash
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    dependencies:
      - target: FilestashFileProvider
      - framework: Fdrive.xcframework
        embed: false
    entitlements:
      path: App/Filestash.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 3736F8X9F9.group.app.filestash.sync
        com.apple.security.network.client: true
  FilestashFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - Wire
      - Shared
      - Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.filestash.mac.fileprovider
        PRODUCT_NAME: FilestashFileProvider
        REGISTER_APP_GROUPS: "YES"
        ENABLE_DEBUG_DYLIB: "NO"
        ENABLE_PREVIEWS: "NO"
    dependencies:
      - framework: Fdrive.xcframework
        embed: false
    info:
      path: Wire/Info.plist
      properties:
        CFBundleDisplayName: Filestash
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: 3736F8X9F9.group.app.filestash.sync
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderActions:
            - NSExtensionFileProviderActionIdentifier: app.filestash.mac.refresh
              NSExtensionFileProviderActionName: Refresh
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
    entitlements:
      path: Wire/FilestashFileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 3736F8X9F9.group.app.filestash.sync
        com.apple.security.network.client: true
