[package]
name = "fdrive-linux"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fdrive"
path = "src/main.rs"

[[bench]]
name = "sqlite"
harness = false

[dependencies]
fdrive-core = { path = "../fdrive-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = "0.4"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.17", default-features = false }
libc = "0.2"

[dev-dependencies]
httpmock = "0.7"
httpdate = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
fdrive-core = { path = "../fdrive-core", features = ["testkit"] }
