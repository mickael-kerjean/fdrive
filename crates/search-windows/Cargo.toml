[package]
name = "search-windows"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "search-windows"
path = "src/main.rs"

[dependencies]
fdrive-core = { path = "../fdrive-core" }
tokio = { version = "1", features = ["rt"] }
url = "2"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
