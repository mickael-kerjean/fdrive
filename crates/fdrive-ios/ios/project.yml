name: Filestash
options:
  bundleIdPrefix: app.filestash
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    # The FileProvider extension must load as a standalone process; the debug
    # dylib split and previews stop it from loading.
    ENABLE_DEBUG_DYLIB: "NO"
    ENABLE_PREVIEWS: "NO"
targets:
  Filestash:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.filestash.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FilestashFileProvider
      - framework: Fdrive.xcframework
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Filestash
        UILaunchScreen: {}
        NSFileProviderDomainUsageDescription: Show your Filestash files in the Files app.
    entitlements:
      path: App/Filestash.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.filestash.sync
  FilestashFileProvider:
    type: app-extension
    platform: iOS
    sources:
      - Wire
      - Shared
      - Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.filestash.ios.fileprovider
    dependencies:
      - framework: Fdrive.xcframework
        embed: false
    info:
      path: Wire/Info.plist
      properties:
        CFBundleDisplayName: Filestash
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderReplicatedExtension: true
          NSExtensionFileProviderDocumentGroup: group.app.filestash.sync
          NSExtensionFileProviderSupportsEnumeration: true
    entitlements:
      path: Wire/FilestashFileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.filestash.sync
