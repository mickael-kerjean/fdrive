[package]
name = "fdrive-omarchy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fdrive-omarchy"
path = "src/main.rs"

[dependencies]
fdrive-core = { path = "../fdrive-core" }
fdrive-linux = { path = "../fdrive-linux", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
